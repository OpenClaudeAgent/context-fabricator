[package]
name = "ctxfab"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.5.2", default-features = false, features = ["json"] }

uuid = "=1.29.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
tempfile = "3"
