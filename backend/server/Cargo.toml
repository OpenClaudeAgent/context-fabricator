[package]
name = "ctxfab-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json"] }
base64 = "=0.23.1"
ctxfab-inference = { path = "../inference" }
opentelemetry = "=0.33.1"
opentelemetry_sdk = "=0.33.1"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.6", default-features = false }
fluent-uri = "=0.4.1"
gix = { version = "=0.90.0", default-features = false, features = ["blocking-network-client", "parallel", "sha1"] }
gix-transport = { version = "=0.62.0", features = ["http-client"] }
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-tls = "=0.6.0"
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
native-tls = "=0.2.18"
rustix = { version = "=1.1.6", features = ["fs"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
sha1 = "=0.11.0"
similar = { version = "=3.2.1", default-features = false, features = ["text"] }
tree-sitter = "=0.26.3"
tree-sitter-rust = "=0.24.0"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3"
uuid = { version = "=1.29.3", features = ["serde"] }
getrandom = "=0.3.4"
whichlang = "=0.1.1"
tree-sitter-java = "=0.23.5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=6.0.0-rc.1", default-features = false, features = ["rt-tokio", "crypto-openssl"] }

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", features = ["testing"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "=3.5.2", default-features = false }

[lints]
workspace = true
