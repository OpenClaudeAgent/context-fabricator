name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_tag:
        description: Create the version tag and a prerelease draft after qualification
        type: boolean
        default: false
      native_inference:
        description: Exercise the Debian package with the catalog Qwen weights
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify candidate version and revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the CLI, server, macOS app and tag versions
        id: source
        shell: bash
        env:
          CREATE_TAG: ${{ inputs.create_tag || false }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("cli/Cargo.toml", "rb"))["package"]["version"])')
          backend=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/server/Cargo.toml", "rb"))["package"]["version"])')
          macos=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION: "([0-9.]+)"$/\1/p' desktop/macos/project.yml)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || $version != "$backend" || $version != "$macos" ]]; then
            echo "The CLI, Rust backend and macOS app must declare the same release version." >&2
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Expected release tag v$version." >&2
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          tag=
          if [[ $GITHUB_REF_TYPE == tag || $CREATE_TAG == true ]]; then
            tag="v$version"
            existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" |
              jq -r --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref) | .ref')
            if [[ -n $existing && $(gh api "repos/$GH_REPO/commits/$tag" --jq .sha) != "$revision" ]]; then
              echo "Tag $tag already points to another commit." >&2
              exit 1
            fi
          fi
          printf 'version=%s\nrevision=%s\ntag=%s\n' "$version" "$revision" "$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: Qualify macOS
    needs: source
    uses: ./.github/workflows/quality.yml

  qt:
    name: Qualify Qt
    needs: source
    uses: ./.github/workflows/qt.yml
    with:
      native_inference: ${{ inputs.native_inference || false }}
      versioned_package: ${{ needs.source.outputs.tag != '' }}

  candidate:
    name: Assemble the qualified packages
    needs: [source, macos, qt]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-arm64
          path: ${{ runner.temp }}/release-packages/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-amd64
          path: ${{ runner.temp }}/release-packages/linux
      - name: Verify package integrity and write checksums
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          debian_version=$VERSION
          if [[ -z $RELEASE_TAG ]]; then debian_version="$VERSION~ci$GITHUB_RUN_NUMBER"; fi
          bash quality/release/collect-candidate.sh \
            "$RUNNER_TEMP/release-packages/macos" \
            "$RUNNER_TEMP/release-packages/linux" \
            "$RUNNER_TEMP/release-candidate" "$VERSION" "$debian_version"
          notes="$RUNNER_TEMP/release-candidate/RELEASE-NOTES.md"
          printf 'Context Fabricator %s preview. Qualified commit %s.\n\n' "$VERSION" "$REVISION" > "$notes"
          cat >> "$notes" <<'EOF'
          The Debian package targets Ubuntu 24.04 amd64. The macOS arm64 ZIP in this
          draft is signed ad hoc for local qualification. Replace it with the
          Developer ID-signed and notarized ZIP, and regenerate SHA256SUMS before publication.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare the GitHub prerelease draft
    needs: [source, candidate]
    if: needs.source.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-tag-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - name: Tag the qualified commit and attach the packages to a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ needs.source.outputs.revision }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          CREATE_TAG: ${{ inputs.create_tag || false }}
        run: |
          cd "$RUNNER_TEMP/release-candidate"
          sha256sum -c SHA256SUMS
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" |
            jq -r --arg ref "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $ref) | .ref')
          if [[ -z $existing && $CREATE_TAG == true ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$REVISION" --silent
          fi
          if [[ $(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha) != "$REVISION" ]]; then
            echo "Tag $RELEASE_TAG does not resolve to the qualified commit." >&2
            exit 1
          fi
          release=$(gh api --paginate --slurp "repos/$GH_REPO/releases" |
            jq -c --arg tag "$RELEASE_TAG" 'first(.[][] | select(.tag_name == $tag)) // null')
          if [[ $release == null ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Context Fabricator $RELEASE_TAG" --notes-file RELEASE-NOTES.md
            release='{"assets":[]}'
          elif ! jq -e --rawfile notes RELEASE-NOTES.md \
            'def trim_end: sub("[[:space:]]+$"; ""); .draft and ((.body | trim_end) == ($notes | trim_end))' \
            <<< "$release" >/dev/null; then
            echo "A different release already exists for this tag." >&2
            exit 1
          fi
          for asset in *.zip *.deb SHA256SUMS; do
            existing=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | (.digest // "unknown")' <<< "$release")
            if [[ -z $existing ]]; then
              gh release upload "$RELEASE_TAG" "$asset"
            else
              digest=$(sha256sum -- "$asset")
              [[ $existing == "sha256:${digest%% *}" ]]
            fi
          done
