name: macOS qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  toolchain:
    name: Swift and Rust quality gates
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          mkdir -p .quality/reports
          make bootstrap 2>&1 | tee .quality/reports/bootstrap.log
      - name: Run gates and prove fixture failures
        run: make qualify-tools
      - name: Retain quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-reports
          path: .quality/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  macos-product:
    name: macOS product and packaged backend
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install app and integration tools
        run: |
          brew install k6 uv
          make bootstrap-app
      - name: Check product code, coverage and API contracts
        run: make check-product
      - name: Verify packaged launcher, helper and CLI
        run: make check-packaged-smoke
      - name: Verify packaged SQLite migration and corpus retrieval
        run: make check-packaged-corpus
      - name: Qualify packaged sync and outbound admission
        run: make check-packaged-outbound
      - name: Qualify embedded telemetry and retention
        run: make check-packaged-telemetry
      - name: Retain product verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-product-reports
          path: .quality/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  runtime-diagnostics:
    name: macOS runtime diagnostics and controlled failures
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install app and integration tools
        run: |
          brew install k6 uv
          make bootstrap-app
      - name: Qualify lifecycle, crash reporting and sanitizers
        run: make qualify-runtime-diagnostics
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-runtime-diagnostics
          path: .quality/reports/
          include-hidden-files: true
          retention-days: 14

  release-package:
    name: macOS arm64 release package
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned app tools
        run: |
          mkdir -p .quality/reports
          make bootstrap-app 2>&1 | tee .quality/reports/release-bootstrap.log
      - name: Verify Rust notices before compiling the Release app
        run: |
          source quality/toolchain/environment.sh
          python3 -B quality/release/app_notices.py --check-rust-target aarch64-apple-darwin \
            2>&1 | tee .quality/reports/release-rust-notices.log
      - name: Verify the Release ZIP and embedded binaries
        run: make qualify-release 2>&1 | tee .quality/reports/release-package.log
      - name: Retain the verified macOS candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: |
            .quality/reports/release-package.*/package/*.zip
            .quality/reports/release-package.*/package/manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain release verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-reports
          path: |
            .quality/reports/release-bootstrap.log
            .quality/reports/release-rust-notices.log
            .quality/reports/release-package.log
            .quality/reports/release-package.*/package/manifest.json
            .quality/reports/release-package.*/results.json
            .quality/reports/release-package.*/notices.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  native-ui:
    name: macOS UI tests (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [foundation, answers, github]
    env:
      CTXFAB_UI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install app tools
        run: make bootstrap-app
      - name: Run packaged XCUI shard
        run: make test-native-ui
      - name: Retain XCUI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ui-${{ matrix.shard }}
          path: .quality/reports/app.*/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  native-ui-coverage:
    name: Native Swift application coverage
    needs: native-ui
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-ui-*
          path: .quality/ui-shards
      - name: Merge XCUI coverage and enforce the gate
        run: make check-native-coverage
      - name: Retain merged coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-app-coverage
          path: .quality/reports/app-coverage.*/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
