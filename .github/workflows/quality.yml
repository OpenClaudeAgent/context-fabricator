name: Quality

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  m01:
    name: Swift and Rust quality gates
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        run: |
          mkdir -p .quality/reports
          make bootstrap 2>&1 | tee .quality/reports/bootstrap.log
      - name: Run gates and prove fixture failures
        run: make quality
      - name: Retain quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m01-quality-reports
          path: .quality/reports/
          if-no-files-found: error
          retention-days: 14

  foundation:
    name: macOS app foundation
    needs: m01
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install app and integration tools
        run: |
          brew install k6 uv
          make bootstrap-app
      - name: Validate the app foundation
        run: make foundation
      - name: Qualify runtime diagnostics and controlled failures
        run: make m02
      - name: Verify packaged SQLite migration and corpus retrieval
        run: make m04
      - name: Qualify packaged sync and outbound admission
        run: make m05
      - name: Qualify embedded telemetry and retention
        run: make m06
      - name: Retain foundation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-reports
          path: .quality/reports/
          if-no-files-found: error
          retention-days: 14

  native-ui:
    name: macOS UI tests (${{ matrix.shard }})
    needs: m01
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [foundation, answers, github]
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CTXFAB_UI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install app tools
        run: make bootstrap-app
      - name: Run packaged XCUI shard
        run: make app-test
      - name: Retain XCUI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ui-${{ matrix.shard }}
          path: .quality/reports/app.*/
          if-no-files-found: error
          retention-days: 14

  native-ui-coverage:
    name: Native Swift application coverage
    needs: native-ui
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-ui-*
          path: .quality/ui-shards
      - name: Merge XCUI coverage and enforce the gate
        run: /bin/bash quality/app.sh merge-ui "$GITHUB_WORKSPACE/.quality/ui-shards"
      - name: Retain merged coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-app-coverage
          path: .quality/reports/app-coverage.*/
          if-no-files-found: error
          retention-days: 14
